<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NAI 큐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 14px;
    color: #8a8f98;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .progress {
    background: #1a1d23;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .progress .num {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.1;
  }
  .progress .num .pct {
    font-size: 18px;
    color: #8a8f98;
    margin-left: 8px;
    font-weight: 400;
  }
  .progress .label {
    color: #8a8f98;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .bar {
    height: 8px;
    background: #2a2e36;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #4a9eff, #6cb6ff);
    transition: width 0.4s ease;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .card {
    background: #1a1d23;
    border-radius: 10px;
    padding: 14px;
  }
  .card .label {
    color: #8a8f98;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 18px;
    font-weight: 500;
  }
  .card.full { grid-column: 1 / -1; }
  .card .value.amber { color: #fbbf24; }
  .card .value.red { color: #f87171; }
  .card .value.muted { color: #6a6f78; font-size: 14px; font-weight: 400; }
  .card .small {
    font-size: 12px;
    color: #8a8f98;
    margin-top: 4px;
    word-break: break-all;
  }
  .ts {
    text-align: center;
    color: #5a5f68;
    font-size: 11px;
    margin-top: 16px;
  }
  .err {
    background: #3a1d1d;
    color: #f87171;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .paused {
    background: #3a2f0a;
    color: #fbbf24;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
  }
  .section-h {
    font-size: 14px;
    color: #8a8f98;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 24px 0 12px 0;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }
  .pill.pending { background: #2a3a5a; color: #93c5fd; }
  .pill.failed { background: #3a1d1d; color: #f87171; }
  .pill.idle { background: #1a2a1a; color: #86efac; }
  .entry {
    background: #1a1d23;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .entry .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry .fn { font-weight: 500; word-break: break-all; flex: 1; }
  .entry .meta { color: #8a8f98; font-size: 11px; margin-top: 4px; }
  .entry.failed { border-left: 3px solid #f87171; }
  .entry.pending { border-left: 3px solid #93c5fd; }
  .entry.done { border-left: 3px solid #86efac; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid #2a2e36;
  }
  .tab-btn {
    background: transparent;
    color: #8a8f98;
    border: none;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
  }
  .tab-btn.active { color: #e6e8eb; border-bottom-color: #4a9eff; }
  .tab-btn:hover:not(.active) { color: #b8bdc7; }
  .batch {
    background: #1a1d23;
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .batch-head {
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .batch-head:hover { background: #20242a; }
  .batch-project { font-weight: 500; font-size: 13px; flex: 1; min-width: 0; word-break: break-all; }
  .batch-meta { color: #8a8f98; font-size: 11px; white-space: nowrap; }
  .batch-body {
    padding: 0 14px 10px;
    border-top: 1px solid #2a2e36;
  }
  .scene-row {
    padding: 5px 0;
    font-size: 11px;
    color: #b8bdc7;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid #20242a;
  }
  .scene-row:last-child { border-bottom: none; }
  .scene-name { flex: 1; min-width: 0; word-break: break-all; }
  .scene-time { color: #6a6f78; flex: none; }

  .maint-btn {
    background: #3a1d1d;
    color: #f87171;
    border: 1px solid #5a2d2d;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }
  .maint-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .maint-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .maint-desc { color: #8a8f98; font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .maint-status { margin-top: 8px; font-size: 12px; padding: 8px 10px; border-radius: 6px; }
  .maint-status.running { background: #1a2030; color: #93c5fd; }
  .maint-status.done { background: #1a2a1a; color: #86efac; }
  .maint-status.err { background: #3a1d1d; color: #f87171; }
</style>
</head>
<body>
  <h1>NAI 이미지 생성 큐</h1>
  <div id="root">로딩 중...</div>
  <h2 class="section-h">Drive 업로드</h2>
  <div id="drive-root">로딩 중...</div>
  <h2 class="section-h">최근 4시간 완료</h2>
  <div id="completed-root">로딩 중...</div>
  <h2 class="section-h">유지보수</h2>
  <button id="cleanup-btn" class="maint-btn">🧹 전체 정리 (tmp + exports + Orphan)</button>
  <div class="maint-desc">① 로컬 <code>tmp/</code> 전체 삭제, ② 로컬 <code>exports/</code> 전체 삭제 (둘은 병렬), ③ 살아있는 프로젝트와 매칭 안 되는 outs/inpaints/vibes/inpaint_masks/inpaint_orgs 폴더 및 exports 파일을 로컬+Drive에서 영구 삭제. 휴지통 거치지 않아요.</div>
  <div id="cleanup-status" style="display:none;"></div>
  <div class="ts" id="ts"></div>
  <div style="text-align:center; margin-top:24px; padding:12px 0; border-top:1px solid #2a2e36; font-size:10px; color:#5a5f68;">
    <a href="https://github.com/danso0429/nai-studio" target="_blank" rel="noopener noreferrer" style="color:#5a5f68; text-decoration:none;">
      © SDStudio Remote · PolyForm Noncommercial 1.0.0
    </a>
  </div>

<script>
  // URL_PREFIX 자동 감지: queue.html 경로에서 추출
  const BASE = window.location.pathname.replace(/\/queue\.html$/, '');

  function fmtDur(ms) {
    if (!ms || ms < 0) return '-';
    const totalSec = ms / 1000;
    if (totalSec < 60) return totalSec.toFixed(2) + '초';
    const m = Math.floor(totalSec / 60);
    const ss = totalSec - m * 60;
    if (m < 60) return m + '분 ' + ss.toFixed(2) + '초';
    const h = Math.floor(m / 60);
    const mm = m % 60;
    if (h < 24) return h + '시간 ' + mm + '분';
    const d = Math.floor(h / 24);
    const hh = h % 24;
    return d + '일 ' + hh + '시간';
  }

  function fmtEta(etaMs) {
    if (!etaMs || etaMs <= 0) return null;
    const done = new Date(Date.now() + etaMs);
    const M = done.getMonth() + 1;
    const D = done.getDate();
    const H = done.getHours();
    const Mi = done.getMinutes();
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return M + '월 ' + D + '일 ' + pad(H) + ':' + pad(Mi);
  }

  function extractProject(p) {
    if (!p) return null;
    // outs/<project>/<file>.png  또는  outs/<folder>/<project>/<file>.png
    const parts = p.split('/');
    if (parts.length >= 3 && parts[0] === 'outs') {
      // 2단계 폴더 케이스 검증 어려움 → 마지막 디렉터리 기준
      return parts.slice(1, -1).join(' / ');
    }
    return parts.length > 1 ? parts[1] : null;
  }

  function extractFile(p) {
    if (!p) return null;
    return p.split('/').pop();
  }

  const root = document.getElementById('root');
  const driveRoot = document.getElementById('drive-root');
  const completedRoot = document.getElementById('completed-root');
  const tsEl = document.getElementById('ts');

  // (탭 시스템 제거 — 2026-05-13 본인 요청으로 현재/완료를 한 페이지에 표시)

  // 완료 batch 펼침 상태 (batchIdx → bool)
  const expandedBatches = {};
  window.toggleBatch = (idx) => {
    expandedBatches[idx] = !expandedBatches[idx];
    tickCompleted();
  };

  function extractProject(entry) {
    if (!entry) return '(unknown)';
    const meta = entry.meta;
    if (meta && typeof meta === 'object' && meta.sceneKey) {
      const sk = String(meta.sceneKey);
      const slash = sk.indexOf('/');
      return slash > 0 ? sk.substring(0, slash) : sk;
    }
    if (entry.outputFilePath) {
      const parts = String(entry.outputFilePath).split('/');
      if (parts[0] === 'outs' && parts.length > 1) return parts[1];
    }
    return '(unknown)';
  }

  function groupBatches(entries) {
    // 같은 프로젝트 + 30분 이내 인접 → 같은 batch. 시간 끊김 또는 다른 프로젝트면 새 batch.
    const GAP = 30 * 60 * 1000;
    const batches = [];
    for (const e of entries) {
      if (!e || typeof e !== 'object') continue;
      const project = extractProject(e);
      const completedAt = e.completedAt || 0;
      const last = batches[batches.length - 1];
      if (last && last.project === project && Math.abs(last.lastAt - completedAt) <= GAP) {
        last.jobs.push(e);
        last.firstAt = Math.min(last.firstAt, completedAt);
        last.lastAt = Math.max(last.lastAt, completedAt);
      } else {
        batches.push({
          project,
          firstAt: completedAt,
          lastAt: completedAt,
          jobs: [e],
        });
      }
    }
    return batches;
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  async function tickCompleted() {
    try {
      const r = await fetch(BASE + '/api/queue/completed', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const entries = d.entries || [];
      if (entries.length === 0) {
        completedRoot.innerHTML = '<div class="paused" style="background:#1a2a1a; color:#86efac;">📭 최근 4시간 완료 없음</div>';
        return;
      }
      const batches = groupBatches(entries);
      const html = batches.map((b, idx) => {
        const open = !!expandedBatches[idx];
        const timeLabel = b.firstAt === b.lastAt ? fmtTime(b.firstAt) : (fmtTime(b.firstAt) + '~' + fmtTime(b.lastAt));
        const shown = b.jobs.slice(0, 10);
        const more = b.jobs.length - shown.length;
        const body = open ? (
          '<div class="batch-body">'
          + shown.map((j) => {
            const jmeta = j && j.meta;
            let sn = (jmeta && jmeta.sceneName) || null;
            // 폴백: outputFilePath에서 sceneName 추출 (outs/project/scene/file.png)
            if (!sn && j && j.outputFilePath) {
              const parts = String(j.outputFilePath).split('/');
              if (parts.length >= 3 && parts[0] === 'outs') sn = parts[parts.length - 2];
            }
            sn = sn || '(unknown)';
            const idx = jmeta && jmeta.jobIndex ? ' ' + jmeta.jobIndex + '/' + (jmeta.jobTotal || '?') : '';
            const ts = j && j.completedAt ? fmtTime(j.completedAt) : '-';
            return '<div class="scene-row"><span class="scene-name">' + escapeHtml(sn) + escapeHtml(idx) + '</span><span class="scene-time">' + ts + '</span></div>';
          }).join('')
          + (more > 0 ? '<div class="scene-row" style="color:#6a6f78; justify-content:center;">+ ' + more + '개 더</div>' : '')
          + '</div>'
        ) : '';
        return '<div class="batch">'
          + '<div class="batch-head" onclick="window.toggleBatch(' + idx + ')">'
          + '<div class="batch-project">' + (open ? '▼ ' : '▶ ') + escapeHtml(b.project) + '</div>'
          + '<div class="batch-meta">' + timeLabel + ' · ' + b.jobs.length + '장</div>'
          + '</div>'
          + body
          + '</div>';
      }).join('');
      completedRoot.innerHTML = html;
    } catch (e) {
      completedRoot.innerHTML = '<div class="err">완료 목록 오류: ' + (e.message || e) + '</div>';
    }
  }

  // timing-history inline 위젯 상태. 평균(누적) card 클릭 시 토글.
  let showTimingHistory = false;
  let timingHistoryData = null;
  window.toggleTimingHistory = () => {
    showTimingHistory = !showTimingHistory;
    if (showTimingHistory) {
      fetchTimingHistory().then(() => tick());
    } else {
      tick();
    }
  };
  async function fetchTimingHistory() {
    try {
      const r = await fetch(BASE + '/api/queue/timing-history', { cache: 'no-store' });
      if (r.ok) timingHistoryData = await r.json();
    } catch {}
  }

  function fmtRelative(target) {
    if (!target) return '-';
    const ms = target - Date.now();
    if (ms <= 0) return '곧';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + '초 후';
    const m = Math.floor(s / 60);
    if (m < 60) return m + '분 ' + (s % 60) + '초 후';
    return Math.floor(m / 60) + '시간 ' + (m % 60) + '분 후';
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 친절 에러 메시지로 변환:
  //   "Generate failed: 429 {\"statusCode\":429,\"message\":\"Concurrent generation is locked\"}"
  //   → "Error 429: Concurrent generation is locked"
  function friendlyErrorMessage(raw) {
    const msg = String(raw || '');
    // JSON { ... } 부분 추출 시도. status 코드 + message만 남기기.
    const jsonMatch = msg.match(/\{[^{}]*"message"\s*:\s*"([^"]*)"[^{}]*\}/);
    const statusMatch = msg.match(/\b([2-5]\d\d)\b/);
    if (statusMatch && jsonMatch) {
      return `Error ${statusMatch[1]}: ${jsonMatch[1]}`;
    }
    if (statusMatch) {
      // status만 있고 JSON 없으면 prefix 정리 후 그대로
      const cleaned = msg.replace(/^Generate failed:?\s*/i, '').trim();
      return `Error ${statusMatch[1]}: ${cleaned.slice(0, 200)}`;
    }
    // fallback: prefix만 정리
    return msg.replace(/^Generate failed:?\s*/i, '').slice(0, 200);
  }

  // meta로 "씬이름 N" 라벨. meta 없으면 jobId 앞 8자.
  function labelFromMeta(meta, jobId) {
    if (meta && meta.sceneName) {
      if (meta.jobIndex && meta.jobTotal) {
        return `${meta.sceneName} ${meta.jobIndex}/${meta.jobTotal}`;
      }
      return meta.sceneName;
    }
    return (jobId || '').slice(0, 8);
  }

  const PHASE_LABEL = { queued: '대기', resize: '이미지 크기 조정', zip: 'zip 생성' };

  async function tickDrive() {
    try {
      const [rDrive, rExport] = await Promise.all([
        fetch(BASE + '/api/drive/retry-status', { cache: 'no-store' }),
        fetch(BASE + '/api/export/status', { cache: 'no-store' }),
      ]);
      if (!rDrive.ok) throw new Error('drive HTTP ' + rDrive.status);
      if (!rExport.ok) throw new Error('export HTTP ' + rExport.status);
      const d = await rDrive.json();
      const exp = await rExport.json();
      const pending = d.pendingCount || 0;
      const failed = d.failedCount || 0;
      const driveTotal = d.count || 0;
      const activeJobs = exp.active || [];
      const exportTotal = activeJobs.length + ((exp.waiting || []).length);
      const grandTotal = driveTotal + exportTotal;

      let banner = '';
      if (grandTotal === 0) {
        banner = '<div class="paused" style="background:#1a2a1a; color:#86efac;">💤 활성 업로드 없음</div>';
      } else {
        const pills = [];
        if (exportTotal > 0) pills.push('<span class="pill pending">내보내기 ' + exportTotal + '</span>');
        if (pending > 0) pills.push('<span class="pill pending">Drive ' + pending + '</span>');
        if (failed > 0) pills.push('<span class="pill failed">실패 ' + failed + '</span>');
        banner = '<div class="card full" style="margin-bottom:8px;"><div class="label">상태</div><div class="value">' + grandTotal + '건' + pills.join('') + '</div></div>';
      }

      // export 진행 (서버 측 resize/zip pipeline) — 동시 10개까지라 active[] 배열로
      let exportHtml = '';
      for (const c of activeJobs) {
        const pct = c.total > 0 ? ((c.done / c.total) * 100).toFixed(2) : '0.00';
        const label = PHASE_LABEL[c.phase] || c.phase;
        exportHtml += '<div class="entry pending">'
          + '<div class="row1"><div class="fn">' + escapeHtml(c.outFileName) + '</div>'
          + '<span class="pill pending">' + label + (c.total > 0 ? ' ' + c.done + '/' + c.total : '') + '</span></div>'
          + '<div class="bar" style="margin-top:6px; height:6px;"><div style="width:' + pct + '%"></div></div>'
          + '</div>';
      }
      for (const w of (exp.waiting || [])) {
        exportHtml += '<div class="entry pending">'
          + '<div class="row1"><div class="fn">' + escapeHtml(w.outFileName) + '</div>'
          + '<span class="pill pending">대기 ' + (w.total || 0) + '장</span></div>'
          + '</div>';
      }

      // Drive 큐 entries
      const entriesHtml = (d.entries || []).map((e) => {
        const isFailed = e.status === 'failed';
        const cls = isFailed ? 'failed' : 'pending';
        const statusLabel = isFailed
          ? '<span class="pill failed">최종 실패</span>'
          : '<span class="pill pending">Drive 시도 ' + (e.attempts || 0) + '/' + (d.maxAttempts || 6) + '</span>';
        const nextRetry = !isFailed && e.nextRetryAt
          ? '<div class="meta">다음 시도: ' + fmtRelative(e.nextRetryAt) + '</div>'
          : '';
        const err = e.lastError ? '<div class="meta">에러: ' + escapeHtml(e.lastError).slice(0, 200) + '</div>' : '';
        return '<div class="entry ' + cls + '"><div class="row1"><div class="fn">' + escapeHtml(e.fileName || e.localPath) + '</div>' + statusLabel + '</div>' + nextRetry + err + '</div>';
      }).join('');

      driveRoot.innerHTML = banner + exportHtml + entriesHtml;
    } catch (e) {
      driveRoot.innerHTML = '<div class="err">Drive 상태 오류: ' + (e.message || e) + '</div>';
    }
  }

  async function tick() {
    try {
      const r = await fetch(BASE + '/api/queue/status', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      // timing-history 위젯이 펼쳐있으면 매 tick마다 함께 갱신 (fire-and-forget)
      if (showTimingHistory) fetchTimingHistory();

      const total = (d.completed || 0) + (d.failed || 0) + (d.pending || 0);
      const done = (d.completed || 0) + (d.failed || 0);
      const pct = total > 0 ? ((done / total) * 100).toFixed(2) : '0.00';

      // 처리 중인 job: meta.sceneName + jobIndex/Total을 메인으로, 그 씬이 속한
      // 프로젝트를 보조로 표시. 파일명(*.png)은 정보 가치 낮아 제거 (2026-05-13 본인 요청).
      const curJob = d.jobs && d.jobs[0] ? d.jobs[0] : null;
      const sceneLabel = curJob ? labelFromMeta(curJob.meta, curJob.jobId) : null;
      const projectName = curJob ? extractProject(curJob) : null;

      const avg = d.avgProcessTimeMs || 0;
      const eta = d.etaMs;
      const etaTime = fmtEta(eta);

      let pausedBanner = '';
      if (d.paused) {
        pausedBanner = '<div class="paused">⏸ 큐 일시정지</div>';
      } else if (!d.processing && d.pending === 0 && total === 0) {
        pausedBanner = '<div class="paused" style="background:#1a2a1a; color:#86efac;">📭 큐 비어있음</div>';
      }

      root.innerHTML = `
        ${pausedBanner}
        <div class="progress">
          <div class="label">진행</div>
          <div class="num">${done} <span style="color:#6a6f78">/ ${total}</span><span class="pct">${pct}%</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
        <div class="grid">
          <div class="card">
            <div class="label">대기</div>
            <div class="value">${d.pending || 0}</div>
          </div>
          <div class="card">
            <div class="label">완료 / 실패</div>
            <div class="value">${d.completed || 0} <span class="muted">/</span> <span class="${d.failed > 0 ? 'red' : 'muted'}">${d.failed || 0}</span></div>
          </div>
          <div class="card" style="cursor: pointer;" onclick="window.toggleTimingHistory()" title="클릭해서 시간대별 통계 보기">
            <div class="label">평균 (누적) ${showTimingHistory ? '▼' : '▶'}</div>
            <div class="value">${(d.allTimeAvgMs || avg) > 0 ? fmtDur(d.allTimeAvgMs || avg) : '<span class="muted">측정 전</span>'}</div>
            <div class="small">총 ${d.allTimeCount != null ? d.allTimeCount.toLocaleString() : '-'}건 · raw ${d.timingHistoryCount || 0}개 (2일)</div>
          </div>
          <div class="card">
            <div class="label">평균 (최근 100건)</div>
            <div class="value">${d.recentAvgMs > 0 ? fmtDur(d.recentAvgMs) : '<span class="muted">측정 전</span>'}</div>
            ${(() => {
              // 현재 시간대 평균 대비 빠름/느림
              const cur = d.recentAvgMs || 0;
              const bucket = d.currentBucketAvgMs || 0;
              if (cur <= 0 || bucket <= 0) return '';
              const ratio = cur / bucket;
              const pct = Math.round((ratio - 1) * 100);
              if (Math.abs(pct) < 3) return '<div class="small muted">현 시간대 평균과 비슷</div>';
              const fast = pct < 0;
              const color = fast ? '#86efac' : '#fbbf24';
              const sign = fast ? '' : '+';
              return '<div class="small" style="color:' + color + ';">현 시간대 대비 ' + sign + pct + '% (' + (fast ? '빠름' : '느림') + ')</div>';
            })()}
          </div>
          <div class="card full">
            <div class="label">남은 시간 (최근 평균 기준)</div>
            <div class="value ${eta ? 'amber' : ''}">${eta ? fmtDur(eta) : '<span class="muted">-</span>'}</div>
          </div>
          <div class="card full">
            <div class="label">완료 예정 시각</div>
            <div class="value ${etaTime ? 'amber' : ''}">${etaTime || '<span class="muted">-</span>'}</div>
          </div>
          <div class="card full">
            <div class="label">처리 중</div>
            <div class="value">${sceneLabel || '<span class="muted">없음</span>'}</div>
            ${projectName && projectName !== '(unknown)' ? `<div class="small">📁 ${projectName}${d.currentProjectQueueCount > 0 ? ` <span style="color:#6a6f78;">(이 프로젝트 큐 ${d.currentProjectQueueCount}건 남음)</span>` : ''}</div>` : ''}
          </div>
          <div class="card">
            <div class="label">디스크 여유</div>
            <div class="value ${d.diskFreeGB < 10 ? 'red' : d.diskFreeGB < 15 ? 'amber' : ''}">${d.diskFreeGB != null ? d.diskFreeGB + ' GB' : '-'}</div>
          </div>
          <div class="card">
            <div class="label">상태</div>
            <div class="value">${d.processing ? '🔄 처리 중' : d.pending > 0 ? '⏸ 대기' : '💤 idle'}</div>
          </div>
        </div>
        ${showTimingHistory ? (() => {
          const parts = [];
          // 시간대별(1h bucket) 통계 — 영구 누적
          if (timingHistoryData && timingHistoryData.stats && timingHistoryData.stats.buckets) {
            const s = timingHistoryData.stats;
            const buckets = s.buckets;
            const maxAvg = Math.max(...buckets.map(b => b.avgMs), 1);
            // 막대 위 평균 텍스트 + 아래 시각 라벨 자리 확보. 단위는 절대 px로 두고 SVG 자체는 가로 100% 스케일.
            const chartW = 600, chartH = 80, topPad = 14, bottomPad = 16, gap = 4;
            const barW = (chartW - gap * (buckets.length - 1)) / buckets.length;
            const bucketBars = buckets.map((b, i) => {
              const x = i * (barW + gap);
              const h = b.avgMs > 0 ? (b.avgMs / maxAvg) * chartH : 0;
              const isCurrent = i === s.currentBucket;
              const fill = isCurrent ? '#fbbf24' : (b.count > 0 ? '#4a9eff' : '#2a2e36');
              const opacity = b.count > 0 ? 0.85 : 0.3;
              const hourStart = String(i * s.bucketHours).padStart(2, '0');
              const hourEnd = String(i * s.bucketHours + s.bucketHours).padStart(2, '0');
              const avgLabel = b.avgMs > 0 ? fmtDur(b.avgMs) : '-';
              const countLabel = b.count > 0 ? b.count.toLocaleString() + '건' : '없음';
              // 짝수 bucket 또는 현재 시간대만 라벨 표시 (12개 다 표시하면 좁은 화면에서 다닥다닥)
              const showLabel = (i % 2 === 0) || isCurrent;
              const valueText = (b.avgMs > 0 && showLabel)
                ? '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (topPad + chartH - h - 3).toFixed(1) + '" text-anchor="middle" font-size="10" fill="' + (isCurrent ? '#fbbf24' : '#c0c4cc') + '">' + avgLabel + '</text>'
                : '';
              const hourText = showLabel
                ? '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (topPad + chartH + 12) + '" text-anchor="middle" font-size="10" fill="' + (isCurrent ? '#fbbf24' : '#6a6f78') + '">' + hourStart + '</text>'
                : '';
              return '<g>'
                + '<rect x="' + x.toFixed(1) + '" y="' + (topPad + chartH - h).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + fill + '" opacity="' + opacity + '">'
                + '<title>' + hourStart + ':00~' + hourEnd + ':00 · ' + countLabel + ' · 평균 ' + avgLabel + '</title>'
                + '</rect>'
                + valueText
                + hourText
                + '</g>';
            }).join('');
            const totalSvgH = topPad + chartH + bottomPad;
            parts.push(
              '<div class="card full" style="margin-top:8px;">'
              + '<div class="label">시간대별 평균 (KST 1시간 단위, 영구 누적 ' + s.allTimeCount.toLocaleString() + '건)</div>'
              + '<svg viewBox="0 0 ' + chartW + ' ' + totalSvgH + '" preserveAspectRatio="none" style="width:100%; height:140px; margin:8px 0; background:#1a1d23; border-radius:4px;">'
              + bucketBars
              + '</svg>'
              + '<div class="small muted">노란색 = 현재 시간대 (KST) · 막대 위 숫자 = 평균 소요시간</div>'
              + '</div>'
            );
          }
          // 최근 raw 기록 (sparkline + list)
          if (!timingHistoryData || !timingHistoryData.entries || timingHistoryData.entries.length === 0) {
            parts.push('<div class="card full" style="margin-top:8px;"><div class="label">최근 처리 기록 (2일)</div><div class="value muted">기록 없음</div></div>');
          } else {
            const entries = timingHistoryData.entries.slice(-200).reverse();
            const maxMs = Math.max(...entries.map(e => e.durationMs));
            const sparkW = 600, sparkH = 40, n = entries.length;
            const bars = entries.slice().reverse().map((e, i) => {
              const x = (i / n) * sparkW;
              const h = maxMs > 0 ? (e.durationMs / maxMs) * sparkH : 0;
              return '<rect x="' + x.toFixed(1) + '" y="' + (sparkH - h).toFixed(1) + '" width="' + (sparkW / n - 0.5).toFixed(1) + '" height="' + h.toFixed(1) + '" fill="#4a9eff" opacity="0.7"/>';
            }).join('');
            const listHtml = entries.map(e => {
              const t = new Date(e.finishedAt).toLocaleTimeString();
              return '<div style="display:flex; justify-content:space-between; padding:3px 8px; border-bottom:1px solid #2a2e36; font-size:11px;"><span style="color:#8a8f98;">' + t + '</span><span>' + fmtDur(e.durationMs) + '</span></div>';
            }).join('');
            parts.push('<div class="card full" style="margin-top:8px;">'
              + '<div class="label">최근 처리 기록 (raw ' + timingHistoryData.count + '개, 최근 200개 표시)</div>'
              + '<svg viewBox="0 0 ' + sparkW + ' ' + sparkH + '" preserveAspectRatio="none" style="width:100%; height:40px; margin:8px 0; background:#1a1d23; border-radius:4px;">'
              + bars
              + '</svg>'
              + '<div style="max-height:200px; overflow-y:auto; background:#1a1d23; border-radius:4px;">' + listHtml + '</div>'
              + '</div>');
          }
          return parts.join('');
        })() : ''}
        ${(d.recentErrors && d.recentErrors.length > 0) ? `
          <h2 class="section-h">최근 NAI 큐 에러 (최대 10개)</h2>
          ${d.recentErrors.slice().reverse().map((e) => {
            const kindLabel = e.kind === '429' ? '<span class="pill" style="background:#3a2f0a;color:#fbbf24;">429</span>'
              : e.kind === '5xx' ? '<span class="pill failed">5xx</span>'
              : '<span class="pill failed">기타</span>';
            const retryLabel = e.retried ? '<span class="pill pending">재시도됨</span>' : '<span class="pill failed">최종 실패</span>';
            const tsStr = new Date(e.ts).toLocaleTimeString();
            const friendly = friendlyErrorMessage(e.error || '');
            const label = labelFromMeta(e.meta, e.jobId);
            return '<div class="entry ' + (e.retried ? 'pending' : 'failed') + '">'
              + '<div class="row1"><div class="fn">' + tsStr + ' · ' + escapeHtml(label) + '</div>'
              + kindLabel + retryLabel + '</div>'
              + '<div class="meta">' + escapeHtml(friendly) + '</div>'
              + '</div>';
          }).join('')}
        ` : ''}
      `;
      tsEl.textContent = '갱신: ' + new Date().toLocaleTimeString();
    } catch (e) {
      root.innerHTML = '<div class="err">오류: ' + (e.message || e) + '</div>';
      tsEl.textContent = '실패: ' + new Date().toLocaleTimeString();
    }
  }

  tick();
  setInterval(tick, 3000);
  tickDrive();
  setInterval(tickDrive, 3000);
  // 완료 탭은 활성 시에만 fetch (3초 주기)
  tickCompleted();
  setInterval(tickCompleted, 3000);

  // ─── 전체 정리 (tmp + exports + Orphan) ─────────────────────────
  // 3단계: ① tmp/exports 파일 목록 조회(병렬) ② delete-batch 두 폴더 병렬 wipe
  // ③ POST cleanup-orphans + WS broadcast로 진행도 수신. 누적 카운트를 한 줄에 표시.
  const CLEANUP_PHASE_LABEL = {
    'local-folders': '로컬 폴더',
    'local-exports': '로컬 exports',
    'drive-folders': 'Drive 폴더',
    'drive-exports': 'Drive exports',
  };
  const cleanupBtn = document.getElementById('cleanup-btn');
  const cleanupStatus = document.getElementById('cleanup-status');
  let cleanupWs = null;
  let cleanupJobId = null;
  // 누적 카운트 — tmp/exports/orphan 단계별 결과를 모아 최종 요약에 사용.
  let cleanupTotals = { tmp: 0, exports: 0, orphanLocal: 0, orphanDrive: 0, driveSkipped: false, errors: 0 };

  function setCleanupStatus(html, kind) {
    cleanupStatus.className = 'maint-status' + (kind ? ' ' + kind : '');
    cleanupStatus.innerHTML = html;
    cleanupStatus.style.display = '';
  }

  function closeCleanupWs() {
    if (cleanupWs) {
      try { cleanupWs.close(); } catch {}
      cleanupWs = null;
    }
  }

  // tmp/exports 한 폴더 통째로 wipe. 목록 조회 → delete-batch. 삭제 건수 반환.
  async function wipeFolder(folder) {
    const r = await fetch(BASE + '/api/fs/list-stats?path=' + encodeURIComponent(folder), { cache: 'no-store' });
    if (!r.ok) throw new Error(folder + ' list HTTP ' + r.status);
    const files = await r.json();
    if (!Array.isArray(files) || files.length === 0) return 0;
    const paths = files.map((f) => folder + '/' + f.name);
    const r2 = await fetch(BASE + '/api/fs/delete-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths }),
    });
    if (!r2.ok) throw new Error(folder + ' delete HTTP ' + r2.status);
    const d = await r2.json();
    return d.deleted || 0;
  }

  function openCleanupWs() {
    closeCleanupWs();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = proto + '//' + location.host + BASE + '/ws';
    try {
      cleanupWs = new WebSocket(url);
    } catch (e) {
      setCleanupStatus('WebSocket 연결 실패: ' + (e.message || e), 'err');
      return;
    }
    cleanupWs.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (!msg || typeof msg.type !== 'string') return;
      if (!msg.type.startsWith('cleanup-orphans-')) return;
      const d = msg.data || {};
      // 이 페이지가 시작 안 한 cleanup이 진행 중일 수도 있음 (다른 클라가 시작).
      // jobId 매칭 안 되면 무시.
      if (cleanupJobId && d.jobId && d.jobId !== cleanupJobId) return;
      if (msg.type === 'cleanup-orphans-progress') {
        const phaseText = CLEANUP_PHASE_LABEL[d.phase] || d.phase || '';
        const item = d.currentItem ? ': ' + escapeHtml(d.currentItem) : '';
        const orphanCounts = '로컬 ' + (d.deleted && d.deleted.local || 0)
                           + ' · Drive ' + (d.deleted && d.deleted.drive || 0);
        const errs = d.errors > 0 ? ' · 오류 ' + d.errors : '';
        const prefix = 'tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports + ' · ';
        setCleanupStatus(
          '<span class="pill pending">③ Orphan: ' + escapeHtml(phaseText) + '</span> '
            + prefix + orphanCounts + errs + item,
          'running'
        );
      } else if (msg.type === 'cleanup-orphans-done') {
        cleanupTotals.orphanLocal = (d.deleted && d.deleted.local && d.deleted.local.length) || 0;
        cleanupTotals.orphanDrive = (d.deleted && d.deleted.drive && d.deleted.drive.length) || 0;
        cleanupTotals.driveSkipped = !!d.driveSkipped;
        cleanupTotals.errors = (d.errors && d.errors.length) || 0;
        showFinalSummary();
        cleanupBtn.disabled = false;
        cleanupJobId = null;
        closeCleanupWs();
      } else if (msg.type === 'cleanup-orphans-error') {
        const localN = (d.deleted && d.deleted.local && d.deleted.local.length) || 0;
        const driveN = (d.deleted && d.deleted.drive && d.deleted.drive.length) || 0;
        setCleanupStatus(
          '✗ Orphan 실패: ' + escapeHtml(d.error || '')
            + ' (이전 단계 tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports
            + ', Orphan 부분: 로컬 ' + localN + '건 · Drive ' + driveN + '건)',
          'err'
        );
        cleanupBtn.disabled = false;
        cleanupJobId = null;
        closeCleanupWs();
      }
    };
    cleanupWs.onerror = () => {
      // onclose에서 처리. 여기서 추가 동작 안 함.
    };
    cleanupWs.onclose = () => {
      // 정상 종료(closeCleanupWs로 cleanupWs=null) 외엔 실패. cleanupJobId 있는데
      // WS 끊긴 거면 사용자에게 알려야 함.
      if (cleanupJobId !== null && cleanupBtn.disabled) {
        setCleanupStatus(
          '진행도 연결 끊김 — Orphan 정리는 서버에서 계속 진행 중일 수 있어요. '
            + '(완료된 단계: tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports + ')',
          'err'
        );
        cleanupBtn.disabled = false;
        cleanupJobId = null;
      }
    };
  }

  function showFinalSummary() {
    const t = cleanupTotals;
    const skipped = t.driveSkipped ? ' (Drive: rclone 미설정)' : '';
    const errs = t.errors > 0 ? ' · 오류 ' + t.errors + '건' : '';
    setCleanupStatus(
      '✓ 완료 — tmp ' + t.tmp + '건 · exports ' + t.exports + '건 · '
        + 'Orphan 로컬 ' + t.orphanLocal + '건 · Orphan Drive ' + t.orphanDrive + '건 삭제'
        + skipped + errs,
      'done'
    );
  }

  cleanupBtn.addEventListener('click', async () => {
    if (!confirm(
      '다음 작업을 영구 삭제로 실행합니다 (휴지통 거치지 않음):\n\n' +
      '① 로컬 tmp/ 폴더 전체 비우기\n' +
      '② 로컬 exports/ 폴더 전체 비우기\n' +
      '③ 살아있는 프로젝트 이름과 매칭 안 되는 outs/inpaints/vibes/inpaint_masks/inpaint_orgs 폴더 및 exports 파일을 로컬+Google Drive에서 삭제\n\n' +
      '되돌릴 수 없습니다. 진행할까요?'
    )) return;
    cleanupBtn.disabled = true;
    cleanupTotals = { tmp: 0, exports: 0, orphanLocal: 0, orphanDrive: 0, driveSkipped: false, errors: 0 };

    // ① + ② tmp/exports 병렬 wipe
    setCleanupStatus('<span class="pill pending">①+② tmp/exports 정리 중</span>', 'running');
    try {
      const [tmpDeleted, exportsDeleted] = await Promise.all([
        wipeFolder('tmp'),
        wipeFolder('exports'),
      ]);
      cleanupTotals.tmp = tmpDeleted;
      cleanupTotals.exports = exportsDeleted;
    } catch (e) {
      setCleanupStatus(
        '✗ tmp/exports 정리 실패: ' + escapeHtml(e.message || String(e))
          + ' (부분: tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports + ')',
        'err'
      );
      cleanupBtn.disabled = false;
      return;
    }

    // ③ Orphan 정리 — fire-and-forget + WS
    setCleanupStatus(
      '<span class="pill pending">③ Orphan 정리 요청 중</span> '
        + 'tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports,
      'running'
    );
    openCleanupWs();
    try {
      const r = await fetch(BASE + '/api/project/cleanup-orphans', { method: 'POST' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      cleanupJobId = d.jobId;
      const note = d.alreadyRunning ? ' (이미 진행 중)' : '';
      setCleanupStatus(
        '<span class="pill pending">③ Orphan 시작' + note + '</span> '
          + 'tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports + ' — 진행도 수신 대기…',
        'running'
      );
    } catch (e) {
      setCleanupStatus(
        '✗ Orphan 시작 실패: ' + escapeHtml(e.message || String(e))
          + ' (tmp ' + cleanupTotals.tmp + ' · exports ' + cleanupTotals.exports + '은 이미 삭제됨)',
        'err'
      );
      cleanupBtn.disabled = false;
      cleanupJobId = null;
      closeCleanupWs();
    }
  });
</script>
</body>
</html>
