<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NAI 큐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 14px;
    color: #8a8f98;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .progress {
    background: #1a1d23;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .progress .num {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.1;
  }
  .progress .num .pct {
    font-size: 18px;
    color: #8a8f98;
    margin-left: 8px;
    font-weight: 400;
  }
  .progress .label {
    color: #8a8f98;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .bar {
    height: 8px;
    background: #2a2e36;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #4a9eff, #6cb6ff);
    transition: width 0.4s ease;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .card {
    background: #1a1d23;
    border-radius: 10px;
    padding: 14px;
  }
  .card .label {
    color: #8a8f98;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 18px;
    font-weight: 500;
  }
  .card.full { grid-column: 1 / -1; }
  .card .value.amber { color: #fbbf24; }
  .card .value.red { color: #f87171; }
  .card .value.muted { color: #6a6f78; font-size: 14px; font-weight: 400; }
  .card .small {
    font-size: 12px;
    color: #8a8f98;
    margin-top: 4px;
    word-break: break-all;
  }
  .ts {
    text-align: center;
    color: #5a5f68;
    font-size: 11px;
    margin-top: 16px;
  }
  .err {
    background: #3a1d1d;
    color: #f87171;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .paused {
    background: #3a2f0a;
    color: #fbbf24;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
  }
  .section-h {
    font-size: 14px;
    color: #8a8f98;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 24px 0 12px 0;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }
  .pill.pending { background: #2a3a5a; color: #93c5fd; }
  .pill.failed { background: #3a1d1d; color: #f87171; }
  .pill.idle { background: #1a2a1a; color: #86efac; }
  .entry {
    background: #1a1d23;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .entry .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry .fn { font-weight: 500; word-break: break-all; flex: 1; }
  .entry .meta { color: #8a8f98; font-size: 11px; margin-top: 4px; }
  .entry.failed { border-left: 3px solid #f87171; }
  .entry.pending { border-left: 3px solid #93c5fd; }
</style>
</head>
<body>
  <h1>NAI 이미지 생성 큐</h1>
  <div id="root">로딩 중...</div>
  <h2 class="section-h">Drive 업로드</h2>
  <div id="drive-root">로딩 중...</div>
  <div class="ts" id="ts"></div>

<script>
  // URL_PREFIX 자동 감지: queue.html 경로에서 추출
  const BASE = window.location.pathname.replace(/\/queue\.html$/, '');

  function fmtDur(ms) {
    if (!ms || ms < 0) return '-';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + '초';
    const m = Math.floor(s / 60);
    const ss = s % 60;
    if (m < 60) return m + '분 ' + ss + '초';
    const h = Math.floor(m / 60);
    const mm = m % 60;
    if (h < 24) return h + '시간 ' + mm + '분';
    const d = Math.floor(h / 24);
    const hh = h % 24;
    return d + '일 ' + hh + '시간';
  }

  function fmtEta(etaMs) {
    if (!etaMs || etaMs <= 0) return null;
    const done = new Date(Date.now() + etaMs);
    const M = done.getMonth() + 1;
    const D = done.getDate();
    const H = done.getHours();
    const Mi = done.getMinutes();
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return M + '월 ' + D + '일 ' + pad(H) + ':' + pad(Mi);
  }

  function extractProject(p) {
    if (!p) return null;
    // outs/<project>/<file>.png  또는  outs/<folder>/<project>/<file>.png
    const parts = p.split('/');
    if (parts.length >= 3 && parts[0] === 'outs') {
      // 2단계 폴더 케이스 검증 어려움 → 마지막 디렉터리 기준
      return parts.slice(1, -1).join(' / ');
    }
    return parts.length > 1 ? parts[1] : null;
  }

  function extractFile(p) {
    if (!p) return null;
    return p.split('/').pop();
  }

  const root = document.getElementById('root');
  const driveRoot = document.getElementById('drive-root');
  const tsEl = document.getElementById('ts');

  function fmtRelative(target) {
    if (!target) return '-';
    const ms = target - Date.now();
    if (ms <= 0) return '곧';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + '초 후';
    const m = Math.floor(s / 60);
    if (m < 60) return m + '분 ' + (s % 60) + '초 후';
    return Math.floor(m / 60) + '시간 ' + (m % 60) + '분 후';
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 친절 에러 메시지로 변환:
  //   "Generate failed: 429 {\"statusCode\":429,\"message\":\"Concurrent generation is locked\"}"
  //   → "Error 429: Concurrent generation is locked"
  function friendlyErrorMessage(raw) {
    const msg = String(raw || '');
    // JSON { ... } 부분 추출 시도. status 코드 + message만 남기기.
    const jsonMatch = msg.match(/\{[^{}]*"message"\s*:\s*"([^"]*)"[^{}]*\}/);
    const statusMatch = msg.match(/\b([2-5]\d\d)\b/);
    if (statusMatch && jsonMatch) {
      return `Error ${statusMatch[1]}: ${jsonMatch[1]}`;
    }
    if (statusMatch) {
      // status만 있고 JSON 없으면 prefix 정리 후 그대로
      const cleaned = msg.replace(/^Generate failed:?\s*/i, '').trim();
      return `Error ${statusMatch[1]}: ${cleaned.slice(0, 200)}`;
    }
    // fallback: prefix만 정리
    return msg.replace(/^Generate failed:?\s*/i, '').slice(0, 200);
  }

  // meta로 "씬이름 N" 라벨. meta 없으면 jobId 앞 8자.
  function labelFromMeta(meta, jobId) {
    if (meta && meta.sceneName) {
      if (meta.jobIndex && meta.jobTotal) {
        return `${meta.sceneName} ${meta.jobIndex}/${meta.jobTotal}`;
      }
      return meta.sceneName;
    }
    return (jobId || '').slice(0, 8);
  }

  const PHASE_LABEL = { queued: '대기', resize: '이미지 크기 조정', zip: 'zip 생성' };

  async function tickDrive() {
    try {
      const [rDrive, rExport] = await Promise.all([
        fetch(BASE + '/api/drive/retry-status', { cache: 'no-store' }),
        fetch(BASE + '/api/export/status', { cache: 'no-store' }),
      ]);
      if (!rDrive.ok) throw new Error('drive HTTP ' + rDrive.status);
      if (!rExport.ok) throw new Error('export HTTP ' + rExport.status);
      const d = await rDrive.json();
      const exp = await rExport.json();
      const pending = d.pendingCount || 0;
      const failed = d.failedCount || 0;
      const driveTotal = d.count || 0;
      const exportTotal = (exp.current ? 1 : 0) + ((exp.waiting || []).length);
      const grandTotal = driveTotal + exportTotal;

      let banner = '';
      if (grandTotal === 0) {
        banner = '<div class="paused" style="background:#1a2a1a; color:#86efac;">💤 활성 업로드 없음</div>';
      } else {
        const pills = [];
        if (exportTotal > 0) pills.push('<span class="pill pending">내보내기 ' + exportTotal + '</span>');
        if (pending > 0) pills.push('<span class="pill pending">Drive ' + pending + '</span>');
        if (failed > 0) pills.push('<span class="pill failed">실패 ' + failed + '</span>');
        banner = '<div class="card full" style="margin-bottom:8px;"><div class="label">상태</div><div class="value">' + grandTotal + '건' + pills.join('') + '</div></div>';
      }

      // export 진행 (서버 측 resize/zip pipeline)
      let exportHtml = '';
      if (exp.current) {
        const c = exp.current;
        const pct = c.total > 0 ? Math.round((c.done / c.total) * 100) : 0;
        const label = PHASE_LABEL[c.phase] || c.phase;
        exportHtml += '<div class="entry pending">'
          + '<div class="row1"><div class="fn">' + escapeHtml(c.outFileName) + '</div>'
          + '<span class="pill pending">' + label + (c.total > 0 ? ' ' + c.done + '/' + c.total : '') + '</span></div>'
          + '<div class="bar" style="margin-top:6px; height:6px;"><div style="width:' + pct + '%"></div></div>'
          + '</div>';
      }
      for (const w of (exp.waiting || [])) {
        exportHtml += '<div class="entry pending">'
          + '<div class="row1"><div class="fn">' + escapeHtml(w.outFileName) + '</div>'
          + '<span class="pill pending">대기 ' + (w.total || 0) + '장</span></div>'
          + '</div>';
      }

      // Drive 큐 entries
      const entriesHtml = (d.entries || []).map((e) => {
        const isFailed = e.status === 'failed';
        const cls = isFailed ? 'failed' : 'pending';
        const statusLabel = isFailed
          ? '<span class="pill failed">최종 실패</span>'
          : '<span class="pill pending">Drive 시도 ' + (e.attempts || 0) + '/' + (d.maxAttempts || 6) + '</span>';
        const nextRetry = !isFailed && e.nextRetryAt
          ? '<div class="meta">다음 시도: ' + fmtRelative(e.nextRetryAt) + '</div>'
          : '';
        const err = e.lastError ? '<div class="meta">에러: ' + escapeHtml(e.lastError).slice(0, 200) + '</div>' : '';
        return '<div class="entry ' + cls + '"><div class="row1"><div class="fn">' + escapeHtml(e.fileName || e.localPath) + '</div>' + statusLabel + '</div>' + nextRetry + err + '</div>';
      }).join('');

      driveRoot.innerHTML = banner + exportHtml + entriesHtml;
    } catch (e) {
      driveRoot.innerHTML = '<div class="err">Drive 상태 오류: ' + (e.message || e) + '</div>';
    }
  }

  async function tick() {
    try {
      const r = await fetch(BASE + '/api/queue/status', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();

      const total = (d.completed || 0) + (d.failed || 0) + (d.pending || 0);
      const done = (d.completed || 0) + (d.failed || 0);
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      const cur = d.jobs && d.jobs[0] ? d.jobs[0].outputFilePath : null;
      const proj = extractProject(cur);
      const fn = extractFile(cur);

      const avg = d.avgProcessTimeMs || 0;
      const eta = d.etaMs;
      const etaTime = fmtEta(eta);

      let pausedBanner = '';
      if (d.paused) {
        pausedBanner = '<div class="paused">⏸ 큐 일시정지</div>';
      } else if (!d.processing && d.pending === 0 && total === 0) {
        pausedBanner = '<div class="paused" style="background:#1a2a1a; color:#86efac;">📭 큐 비어있음</div>';
      }

      root.innerHTML = `
        ${pausedBanner}
        <div class="progress">
          <div class="label">진행</div>
          <div class="num">${done} <span style="color:#6a6f78">/ ${total}</span><span class="pct">${pct}%</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
        <div class="grid">
          <div class="card">
            <div class="label">대기</div>
            <div class="value">${d.pending || 0}</div>
          </div>
          <div class="card">
            <div class="label">완료 / 실패</div>
            <div class="value">${d.completed || 0} <span class="muted">/</span> <span class="${d.failed > 0 ? 'red' : 'muted'}">${d.failed || 0}</span></div>
          </div>
          <div class="card">
            <div class="label">평균 (누적)</div>
            <div class="value">${avg > 0 ? fmtDur(avg) : '<span class="muted">측정 전</span>'}</div>
            <div class="small">기록 ${d.timingHistoryCount || 0}개 / 1만</div>
          </div>
          <div class="card">
            <div class="label">평균 (최근 100건)</div>
            <div class="value">${d.recentAvgMs > 0 ? fmtDur(d.recentAvgMs) : '<span class="muted">측정 전</span>'}</div>
          </div>
          <div class="card full">
            <div class="label">남은 시간 (최근 평균 기준)</div>
            <div class="value ${eta ? 'amber' : ''}">${eta ? fmtDur(eta) : '<span class="muted">-</span>'}</div>
          </div>
          <div class="card full">
            <div class="label">완료 예정 시각</div>
            <div class="value ${etaTime ? 'amber' : ''}">${etaTime || '<span class="muted">-</span>'}</div>
          </div>
          <div class="card full">
            <div class="label">처리 중</div>
            <div class="value">${proj || '<span class="muted">없음</span>'}</div>
            ${fn ? `<div class="small">${fn}</div>` : ''}
          </div>
          <div class="card">
            <div class="label">디스크 여유</div>
            <div class="value ${d.diskFreeGB < 10 ? 'red' : d.diskFreeGB < 15 ? 'amber' : ''}">${d.diskFreeGB != null ? d.diskFreeGB + ' GB' : '-'}</div>
          </div>
          <div class="card">
            <div class="label">상태</div>
            <div class="value">${d.processing ? '🔄 처리 중' : d.pending > 0 ? '⏸ 대기' : '💤 idle'}</div>
          </div>
        </div>
        ${(d.recentErrors && d.recentErrors.length > 0) ? `
          <h2 class="section-h">최근 NAI 큐 에러 (최대 10개)</h2>
          ${d.recentErrors.slice().reverse().map((e) => {
            const kindLabel = e.kind === '429' ? '<span class="pill" style="background:#3a2f0a;color:#fbbf24;">429</span>'
              : e.kind === '5xx' ? '<span class="pill failed">5xx</span>'
              : '<span class="pill failed">기타</span>';
            const retryLabel = e.retried ? '<span class="pill pending">재시도됨</span>' : '<span class="pill failed">최종 실패</span>';
            const tsStr = new Date(e.ts).toLocaleTimeString();
            const friendly = friendlyErrorMessage(e.error || '');
            const label = labelFromMeta(e.meta, e.jobId);
            return '<div class="entry ' + (e.retried ? 'pending' : 'failed') + '">'
              + '<div class="row1"><div class="fn">' + tsStr + ' · ' + escapeHtml(label) + '</div>'
              + kindLabel + retryLabel + '</div>'
              + '<div class="meta">' + escapeHtml(friendly) + '</div>'
              + '</div>';
          }).join('')}
        ` : ''}
      `;
      tsEl.textContent = '갱신: ' + new Date().toLocaleTimeString();
    } catch (e) {
      root.innerHTML = '<div class="err">오류: ' + (e.message || e) + '</div>';
      tsEl.textContent = '실패: ' + new Date().toLocaleTimeString();
    }
  }

  tick();
  setInterval(tick, 3000);
  tickDrive();
  setInterval(tickDrive, 3000);
</script>
</body>
</html>
